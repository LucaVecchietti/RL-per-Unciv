training:
  total_timesteps: 500_000
  n_envs: 4                  # Ambienti paralleli
  learning_rate: 0.0003
  n_steps: 1024              # Passi per update PPO (ridotto per Fase 1.5)
  batch_size: 64
  n_epochs: 10
  gamma: 0.99                # Discount factor
  clip_range: 0.2
  ent_coef: 0.01             # Entropia — aumentare a 0.05 se policy collassa

environment:
  max_turns: 150             # Turni massimi per episodio (Fase 1.5)
  map_size: "tiny"           # tiny | small | standard
  victory_type: "science"    # Obiettivo iniziale semplificato

paths:
  save_dir: "models/checkpoints"
  log_dir: "logs"
  unciv_saves: "saves"

unciv:
  jar_path: "unciv/Unciv.jar"
  java_path: "java"               # usa il java sul PATH (reinstallare JDK 21+ con winget)
  headless_timeout: 60            # secondi max per startup READY e per advance (turn processing)
  headless_action_timeout: 5      # secondi max per comandi-unità (move/found/improve/legalmoves): normale <1s, oltre = hang
  saves_prefix: "current_game"    # prefisso save files paralleli

reward:
  # --- Legacy (invariati) ---
  exploration: 0.3                 # reward per nuova tile esplorata
  resource_placement: 2.0          # bonus per tile-risorsa catturata nel territorio (Fase C2)

  # --- Modificati in File 23.1 / Sessione 45.1 ---
  found_city: 10.0                  # 23.1=3.0; 45.1 lo riporta a 6.0 per rompere stallo cities_founded

  # --- File 23.1 — risorse connesse tipizzate (ex resource_connected: 3.0) ---
  resource_connected_bonus:     6.0   # Banana, Wheat, Stone, Cattle…
  resource_connected_strategic: 8.0   # Iron, Horses, Coal, Oil…
  resource_connected_luxury:    10.0   # Gems, Silk, Spices, Gold (luxury)…

  # --- File 23.1 — espansione continua ---
  cities_alive_bonus: 0.5         # per turno, per ogni città oltre la prima (45.1: 0.05→0.15)

  # --- File 23.1 — stats accumulate (delta clip ≥ 0) ---
  science_accumulated:   2.5
  gold_accumulated:      2.5
  culture_accumulated:   2.5
  happiness_accumulated: 2.5
  faith_accumulated:     2.5      # inerte finché faith_per_turn=0 nel parser

  # --- File 23.1 — shaping aggiuntivi ---
  tech_progress:        0.5        # delta normalizzato (progress/cost), clip [0,1]
  units_stuck_penalty:  0.05       # per unità stuck nel turno corrente
  happiness_bonus:      0.05       # cap implicito = peso, attivo se happiness > 5
  building_diversity:   1        # una tantum per building nuovo nel set civ (45.1: 0.5→0.2)

  # --- File 24 — rete commerciale (road / trade-network) ---
  # Event-based: ogni nuova città non-capitale che diventa connessa = boost. Il reward arriva
  # 1 turno dopo il buildroad effettivo (transient cache aggiornata al startTurn successivo).
  city_connected_to_capital: 4.0
  # Denso piccolo: piccolo gradiente per ogni road posata (bootstrap Worker). Sopprimibile a 0.0.
  road_built: 0.3
